    <!-- ── TWO FONTS WERE BEING FETCHED ON EVERY PAGE AND NEVER DRAWN ────────────────
         Oswald and Bangers were preloaded here for months. Neither is set anywhere any
         more: the record's headings moved to its own reading face, and the cartoon room's
         lettering moved to the record's voice (see cartoon-ink.css). Every visitor was
         still paying two CSS requests and up to three font files for them, on every page,
         before any text could settle. Both are gone. The comment stays so nobody adds them
         back believing they are load-bearing. -->
    <!-- THE READING VOICE. The record's sentences were set in the same monospace as its dates
         and field names, which is what made a news page read like a code editor. Source Serif 4
         is a newspaper face: it holds a long paragraph on a phone and it is not a costume.
         Fetched the same way as Oswald, off the critical path, so first paint never waits. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" /></noscript>

    <!-- THE RECORD'S OWN READING VOICE. Literata was drawn for reading long text on a screen
         rather than for a brochure, so it holds a paragraph at seventeen pixels without going
         thin or spidery — and it is the record's own face rather than the one every device
         happens to ship. Noto Serif travels beside it: one family covering hundreds of scripts,
         so a reader in Arabic, Devanagari or Chinese gets real lettering, never empty boxes.
         Both are under the Open Font Licence, which means no one can ever withdraw them: the
         files can be copied, self-hosted and handed on by anybody, for as long as the record
         exists. The browser fetches only the script it is actually displaying. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Noto+Serif:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Noto+Serif:wght@400;600&display=swap" /></noscript>

    <!-- Catch failed module downloads before the app's imports start. -->
    <script id="uf51-boot-recovery">
      (function () {
        // ── THE EDITOR PREVIEW NEVER RECOVERS ──────────────────────────────────
        // The preview runs on its own host. A background worker stored there keeps
        // serving an old copy of the app's code, and this script's answer to that is
        // to reload the page — so it reloads forever and the editor gives up before
        // the app starts. On that host we install nothing, reload nothing, and clear
        // whatever is already stored, every load, so it cannot come back.
        // The published app is a different hostname: none of this reaches it.
        if (window.location.hostname.indexOf('preview-sandbox--') === 0) {
          // A tap may recover. Nothing recovers on its own here: an automatic reload on this
          // host used to loop forever, so the automatic answer stays off and a person's one
          // press becomes the only thing that reloads the page.
          window.__uf51RecoverBuild = function (force) {
            if (!force) return false;
            window.location.reload();
            return true;
          };
          window.__uf51IsModuleLoadError = function () { return false; };
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                registrations.forEach(function (registration) {
                  registration.unregister().catch(function () {});
                });
              }).catch(function () {});
            }
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (name) { caches.delete(name).catch(function () {}); });
              }).catch(function () {});
            }
          } catch (_) {}
          // A file that failed to arrive here must not become a raw red error in the editor.
          // The same calm message and the same one-tap retry as everywhere else, minus the
          // automatic reload this host cannot survive. `failed` is hoisted, so it is already
          // in reach even though it is written further down.
          window.addEventListener('error', function (event) {
            var target = event.target;
            var moduleish = /Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module|Outdated Optimize Dep|Unable to preload CSS/i.test(String((event.error && event.error.message) || event.message || ''));
            if ((target && target.tagName === 'SCRIPT' && target.type === 'module') ||
                (target && target.tagName === 'LINK' && target.rel === 'modulepreload') || moduleish) failed(event);
          }, true);
          window.addEventListener('unhandledrejection', function (event) {
            if (/Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module|Outdated Optimize Dep|Unable to preload CSS/i.test(String((event.reason && event.reason.message) || event.reason || ''))) failed(event);
          });
          window.addEventListener('vite:preloadError', failed);
          return;
        }

        var key = 'uf51_build_reload';
        var marker = '_uf51_reload';
        var recovering = false;
        window.__uf51RecoverBuild = function (force) {
          if (recovering) return true;
          if (navigator.onLine === false) return false;
          var url = new URL(window.location.href);
          var last = Number(url.searchParams.get(marker) || 0);
          try { last = Math.max(last, Number(sessionStorage.getItem(key) || 0)); } catch (_) {}
          if (!force && Date.now() - last < 60000) return false;
          recovering = true;
          var now = Date.now();
          try { sessionStorage.setItem(key, String(now)); } catch (_) {}
          url.searchParams.set(marker, String(now));
          var repairs = [];
          // Refresh our workers without removing push subscriptions.
          if ('serviceWorker' in navigator) repairs.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.allSettled(registrations.filter(function (registration) {
                var worker = registration.active || registration.waiting || registration.installing;
                return worker && /\/(?:serveServiceWorker|serveClimateServiceWorker|serveSortedServiceWorker|buzzstopServiceWorker|sw\.js|buzzstop-sw\.js)(?:\?|$)/.test(new URL(worker.scriptURL).pathname);
              }).map(function (registration) { return registration.update(); }));
            })
          );
          // A query on the page alone does not invalidate cached module responses.
          // Remove only downloaded code/pages from our caches, never saved work or photos.
          if ('caches' in window) repairs.push(caches.keys().then(function (names) {
            return Promise.allSettled(names.filter(function (name) {
              return /^(?:cb51-v\d+|twcc-v\d+|buzzstop-v\d+|sorted-v\d+-offline)$/.test(name);
            }).map(function (name) {
              return caches.open(name).then(function (cache) {
                return cache.keys().then(function (requests) {
                  return Promise.allSettled(requests.map(function (request) {
                    return cache.match(request).then(function (response) {
                      var type = response && response.headers.get('Content-Type') || '';
                      if (/html|javascript|ecmascript|text\/css/i.test(type)) return cache.delete(request);
                    });
                  }));
                });
              });
            }));
          }));
          Promise.race([
            Promise.allSettled(repairs),
            new Promise(function (resolve) { setTimeout(resolve, 5000); })
          ]).then(function () { window.location.replace(url.href); });
          return true;
        };
        function failed(event) {
          if (window.__uf51RecoverBuild()) {
            if (event.cancelable) event.preventDefault();
            return;
          }
          var loading = document.getElementById('uf51-startup');
          if (!loading) return;
          loading.style.flexDirection = 'column';
          loading.style.gap = '16px';
          loading.style.padding = '24px';
          loading.style.textAlign = 'center';
          loading.style.letterSpacing = 'normal';
          loading.textContent = 'The page could not download. Please try again.';
          var button = document.createElement('button');
          button.textContent = 'Try again';
          button.style.cssText = 'font:inherit;padding:12px 20px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer';
          button.onclick = function () { window.__uf51RecoverBuild(true); };
          loading.appendChild(button);
        }
        function moduleFailure(error) {
          return /Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module|Outdated Optimize Dep|Unable to preload CSS/i.test(String(error && error.message || error || ''));
        }
        window.__uf51IsModuleLoadError = moduleFailure;
        window.addEventListener('error', function (event) {
          var target = event.target;
          if ((target && target.tagName === 'SCRIPT' && target.type === 'module') ||
              (target && target.tagName === 'LINK' && target.rel === 'modulepreload') || moduleFailure(event.error || event.message)) failed(event);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          if (moduleFailure(event.reason)) failed(event);
        });
        window.addEventListener('vite:preloadError', failed);
      })();
    </script>

    <!-- PATH-AWARE OG TAGS — set before React mounts so social scrapers see the right info -->
    <script>

        } else if (path === 'sortedfororgs') {

            title: 'SORTED for Organisations \u2014 Free Pilot for Advice Centres',

            image: 'https://uf51.love/api/functions/serveSortedOGImage',
            url: 'https://uf51.love/SortedForOrgs'
          };
        } else if (path.startsWith('petsounds51')) {
          meta = {

            image: 'https://uf51.love/api/functions/servePetSounds51OGImage',

        } else if (path === 'cb51' || path.startsWith('cb51')) {
          meta = {
            title: 'CB51 \u2014 AI Co-Manager for Artists',

            image: 'https://uf51.love/api/functions/serveOGImage?brand=cb51',

          // The cartoon room travels on the real cover rather than the record's mark: it is

        // Write OG tags into <head> immediately
        var tags = [
          ['title', null, meta.title],
          ['meta', {name:'description', content: meta.desc}],
          ['meta', {'property':'og:title', content: meta.title}],
          ['meta', {'property':'og:description', content: meta.desc}],
          ['meta', {'property':'og:image', content: meta.image}],
          ['meta', {'property':'og:image:width', content: meta.imageWidth || '1200'}],
          ['meta', {'property':'og:image:height', content: meta.imageHeight || '630'}],
          ['meta', {'property':'og:type', content:'website'}],
          ['meta', {'property':'og:url', content: meta.url}],
          ['meta', {name:'twitter:card', content:'summary_large_image'}],
          ['meta', {name:'twitter:title', content: meta.title}],
          ['meta', {name:'twitter:description', content: meta.desc}],
          ['meta', {name:'twitter:image', content: meta.image}],
        ];

        tags.forEach(function(t) {
          if (t[0] === 'title') {
            document.title = t[2];
            return;
          }
          var el = document.createElement(t[0]);
          var attrs = t[1];
          Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
          document.head.appendChild(el);
        });
      })();
