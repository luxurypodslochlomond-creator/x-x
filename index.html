    <script>

          meta = {
            title: 'SORTED \u2014 Decode Scary Letters in 30 Seconds',

            image: 'https://uf51.love/api/functions/serveSortedOGImage',
            url: 'https://uf51.love/Sorted'
          };
        } else if (path === 'sortedpressrelease') {
          meta = {
            title: 'SORTED \u2014 Press Release 2026',

            image: 'https://uf51.love/api/functions/serveSortedOGImage',

        } else if (path === 'sortedinvestorpress') {

          };
        } else if (path === 'sortedfororgs') {
          meta = {
            title: 'SORTED for Organisations \u2014 Free Pilot for Advice Centres',
            desc: 'Help your clients understand official letters before deadlines pass. AI-assisted, private, multilingual. Free pilot for advice centres, debt charities and housing associations.',
            image: 'https://uf51.love/api/functions/serveSortedOGImage',
            url: 'https://uf51.love/SortedForOrgs'
          };
        } else if (path.startsWith('petsounds51')) {
          meta = {
            title: 'PetSounds51 \u2014 Sound Therapy for Anxious Pets',
            desc: 'Psychoacoustic protocols for dogs, cats and horses. Built on peer-reviewed research. Try free.',
            image: 'https://uf51.love/api/functions/servePetSounds51OGImage',
            url: 'https://uf51.love/PetSounds51'
          };
        } else if (path === 'cb51' || path.startsWith('cb51')) {
          meta = {
            title: 'CB51 \u2014 AI Co-Manager for Artists',
            desc: 'Avoid the noise. CB51 handles gig offers, band voting, finance and contracts.',
            image: 'https://uf51.love/api/functions/serveOGImage?brand=cb51',
            url: 'https://uf51.love/CB51'
          };
        } else if (path === 'buzzstop') {
          meta = {
            title: 'BuzzStop \u2014 Tinnitus Cancellation Engine',
            desc: 'AI-powered tinnitus relief. Radar-based frequency engine. Free. No signup.',
            image: 'https://uf51.love/api/functions/serveOGImage',
            url: 'https://uf51.love/BuzzStop'
          };
        } else if (path === 'togetherchangeclimate' || path === 'climateplatform') {
          meta = {
            title: 'Together We Change Climate \u2014 Verified Climate Solutions',
            desc: 'A public record of climate emergencies and the positive actions that work \u2014 shared openly, internationally. Every language on Earth.',
            image: 'https://uf51.love/api/functions/serveOGImage',
            url: 'https://uf51.love/TogetherChangeClimate'
          };
        }

        // Write OG tags into <head> immediately
        var tags = [
          ['title', null, meta.title],
          ['meta', {name:'description', content: meta.desc}],
          ['meta', {'property':'og:title', content: meta.title}],
          ['meta', {'property':'og:description', content: meta.desc}],
          ['meta', {'property':'og:image', content: meta.image}],
          ['meta', {'property':'og:image:width', content:'1200'}],
          ['meta', {'property':'og:image:height', content:'630'}],
          ['meta', {'property':'og:type', content:'website'}],
          ['meta', {'property':'og:url', content: meta.url}],
          ['meta', {name:'twitter:card', content:'summary_large_image'}],
          ['meta', {name:'twitter:title', content: meta.title}],
          ['meta', {name:'twitter:description', content: meta.desc}],
          ['meta', {name:'twitter:image', content: meta.image}],
        ];

        tags.forEach(function(t) {
          if (t[0] === 'title') {
            document.title = t[2];
            return;
          }
          var el = document.createElement(t[0]);
          var attrs = t[1];
          Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
          document.head.appendChild(el);
        });
      })();
    </script>
