<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your sign-in code</title>
</head>
<!--
  THE CODE, AND NOTHING ELSE.

  This is the one letter a stranger can trigger by typing any address into the sign-in
  form, so it is written as plainly as a letter can be: a code, what it is for, and a line
  saying what to do if it was not you. No offers, no marketing, no other product's name.

  It uses only {{otp_code}} — and only as visible text, never inside an attribute. Every
  link and image in it is a literal https address on the record's own domain, because a
  variable inside an attribute makes that attribute drop out of this mail entirely.
-->
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
<tr>
<td align="center" style="padding:0;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:4px;overflow:hidden;">

  <tr>
  <td style="background:#b3261e;padding:22px 32px;">
    <p style="margin:0;font-family:'Oswald',Impact,'Arial Narrow',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#ffffff;">Record of the Time</p>
  </td>
  </tr>

  <tr>
  <td style="padding:36px 32px 8px;">
    <h1 style="margin:0 0 10px;font-family:'Oswald',Impact,'Arial Narrow',Arial,sans-serif;font-size:30px;line-height:1.12;color:#1a1612;">Your sign-in code</h1>
    <p style="margin:0 0 22px;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.65;color:#6b6258;">Type this code where you were asked for it. It is the only thing needed to finish signing in.</p>
  </td>
  </tr>

  <tr>
  <td style="padding:0 32px 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#efe7d6;border:1px solid #e5e7eb;border-radius:4px;">
    <tr>
    <td align="center" style="padding:22px 18px;">
      <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;letter-spacing:0.22em;color:#1a1612;">{{otp_code}}</p>
    </td>
    </tr>
    </table>
  </td>
  </tr>

  <tr>
  <td style="padding:0 32px 34px;">
    <p style="margin:0;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;line-height:1.65;color:#6b6258;">If you did not ask to sign in, ignore this letter: the code simply expires, and nothing has changed.</p>
  </td>
  </tr>

  <tr>
  <td style="background:#efe7d6;border-top:1px solid #e5e7eb;padding:20px 32px;">
    <p style="margin:0;font-family:'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b6258;">Record of the Time</p>
    <p style="margin:6px 0 0;font-family:'Courier New',Courier,monospace;font-size:11px;line-height:1.6;color:#6b6258;">https://uf51.love</p>
  </td>
  </tr>

</table>
</td>
</tr>
</table>
</body>
</html>
